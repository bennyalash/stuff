<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benny Al-Ashari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@200..800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://code.jquery.com/jquery-latest.js"></script>
    <link rel="shortcut icon" href="b.png" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="projectsContainer">
        <div id="header" class="header">
            <h1>Benny Al-Ashari</h1>
            <input id="copy" type="text" value="Benny Al-Ashari" hidden />
            <input id="copy2" type="text" value="My Projects" hidden />
            <input id="copy3" type="text" value="Projects" hidden />
            <input id="copy4" type="text" value="Resume" hidden />
        </div>
        <div id="projectsGrid" class="projects"></div>
        <div id="projectDetail" style="display: none; padding: 20px 0;"></div>
    </div>

    <script src="projects.js"></script>
    <script>
        const sortedData = projectsData.sort((a, b) => b.rate - a.rate);

        function renderProjects(projects) {
            const container = document.getElementById("projectsGrid");

            container.innerHTML = projects.map((project, index) => {
                const innerContent = `
                    <div class="image" style="background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1)), ${project.bg || '#000'}">
                        ${project.img
                    ? `<img src="images/project_logos/${project.img}" class="${project.bg ? 'logo' : ''}" alt="${project.title}">`
                            : `<div>${project.title}</div>`}
                    </div>
                `;

                return `
                    <div class="project">
                        <div onclick="openDetail(${index})">${innerContent}</div>
                        <div class="title">
                            <h3>${project.title}</h3>
                            <div class="category">${project.type.toUpperCase()}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDetail(index) {
            const project = sortedData[index];
            document.getElementById("projectsGrid").style.display = "none";
            document.getElementById("header").style.display = "none";

            const detail = document.getElementById("projectDetail");
            detail.style.display = "block";
            detail.innerHTML = `
                <div class="project-detail-header">
                    <button onclick="closeDetail()" class="close">x</button>

                    <div class="image" style="background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1)), ${project.bg || '#000'}">
                        ${project.img
                            ? `<img src="images/project_logos/${project.img}" class="${project.bg ? 'logo' : ''}" alt="${project.title}">`
                            : `<div>${project.title}</div>`}
                    </div>
                    <div>
                        <h2>${project.title}</h2>
                        <div class="links">
                            ${project.buy ? `<p><a class="button" href="${project.buy}" target="_blank">Buy</a></p>` : ''}
                            ${project.link ? `<p><a href="${project.link}" target="_blank">${project.cta || "Go To Project"} ↗</a></p>` : ''}
                        </div>
                    </div>
                </div>
                <br />
                <p>${project.description || ''}</p>
                <button onclick="closeDetail()" style="margin-top: 15px; cursor: pointer;">Back to All Projects</button>
            `;
        }

        function closeDetail() {
            document.getElementById("projectDetail").style.display = "none";
            document.getElementById("projectsGrid").style.display = "grid";
            document.getElementById("header").style.display = "block";
        }

        renderProjects(sortedData);
    </script>
</body>
</html>
