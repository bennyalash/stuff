//------------------------------------------------------------------------------
// Code by Benny Al-Ashari (Refactored & Sharp-DPI Fix)
//------------------------------------------------------------------------------

const canvas = document.querySelector("#scene");
const ctx = canvas.getContext("2d");
const colors = ["#000000", "#330000", "#660000", "#990000", "#bb0000", "#dd0000", "#ff0000"];
const words = [
  document.querySelector("#copy"),
  document.querySelector("#copy2"),
  document.querySelector("#copy3"),
  document.querySelector("#copy4")
];
    let mouse = {x:0,y:0};
     let  run = 25;
     let radius = window.innerWidth / 100;
let particles = [];
let ww = 0;
let wh = 0;
let dpr = 1;

// Stagger Settings
let activeCount = 0;
let intervalId = null;
const chunkSize = 20; // Increased chunk size for visible progress
const delayMs = 0;   // Decreased delay interval for smooth flow

function setupCanvasDimensions() {
  dpr = window.devicePixelRatio || 1;
  
  ww = window.innerWidth;
  //wh = Math.min(300, ww / 3);
  wh = window.innerHeight;
  canvas.width = Math.floor(ww * dpr);
  canvas.height = Math.floor(wh * dpr);

  ctx.scale(dpr, dpr);
}

function getTextWidth(text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

// Particle Class
function Particle(x, y) {
  //this.x = Math.random() * ww;
  //this.y = Math.random() * wh;
  this.x = x + (Math.random() - 0.5);
  this.y = y + (Math.random() - 0.5);
  this.dest = { x: x, y: y };
  this.vx = (Math.random() - 0.5) * 0;
  this.vy = (Math.random() - 0.5) * 0;
  this.accX = 0;
  this.accY = 0;
  this.friction = 0.9;
  this.color = colors[0];
}

Particle.prototype.render = function () {
  this.accX = (this.dest.x - this.x) / 250 + (Math.random() - 0.5)/15000 * Math.min(1000, ww);
  this.accY = (this.dest.y - this.y) / 250 + (Math.random() - 0.5)/15000 * Math.min(1000, ww);
  
  this.vx += this.accX;
  this.vy += this.accY;
  this.vx *= this.friction / 1;
  this.vy *= this.friction / 1;
  this.r += (Math.min(ww, 1000)/500 - this.r)/250

  this.x += this.vx;
  this.y += this.vy;

  this.color = colors[0];

  ctx.fillStyle = this.color;
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2, false);
  ctx.fill();


  var a = this.x - mouse.x;
    var b = this.y - mouse.y;
    
    var distance = Math.sqrt( a*a + b*b );
    if(distance<(radius)){
      this.accX = (this.x - mouse.x)/run;
      this.accY = (this.y - mouse.y)/run;
      this.vx += this.accX + (Math.random() - 0.5) * 1;
      this.vy += this.accY + (Math.random() - 0.5) * 1;
    }
};

Particle.prototype.size = function (s) {
  //this.r = 0 * (ww / 900) + (ww / 1800) + s / 150;
  this.r = 1;
};

Particle.prototype.wild = function () {
  this.vx = (Math.random() - 0.5) * 5;
  this.vy = (Math.random() - 0.5) * 5;
};

function startStaggeredRender() {
  if (intervalId) {
    clearInterval(intervalId);
  }

  activeCount = 0;

  intervalId = setInterval(() => {
    activeCount = Math.min(activeCount + chunkSize, particles.length);
    if (activeCount >= particles.length) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }, delayMs);
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initScene() {
  setupCanvasDimensions();

  const urlParams = new URLSearchParams(window.location.search);
  let page = parseInt(urlParams.get("page"), 10);
  if (isNaN(page) || page < 0 || page >= words.length) {
    page = 0;
  }

  const activeWord = words[page] ? words[page].value : "Demo";

  ctx.clearRect(0, 0, ww, wh);

  let size = activeWord.length;

  const vwInPixels = window.innerWidth / 100;

const pxBase = 50; // 20px fixed
const vwAmount = 3; // 3vw relative

// Calculate total pixels
const totalFontSize = pxBase + (vwAmount * vwInPixels);

// Set canvas font directly in pixels
ctx.font = `bold ${vwInPixels*4+40 - size}px 'Fustat'`;

 // while (getTextWidth(activeWord, ctx.font) > ww - 50) {
  //  size += 0.1;
   // ctx.font = `bold ${vwInPixels*4+40 - size}px 'Fustat'`;
  //}

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(activeWord, ww / 2, 60 + ww / 25);

  const pixelData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

  ctx.clearRect(0, 0, ww, wh);

  particles = [];
  // Fixed step integer values so pixel sampling doesn't explode
  const stepX = ww < 1000 ? 0.5 : 1;
  const stepY = ww < 1000 ? 1.5 : 3;

  for (let i = 0; i < ww; i += stepX) {
    for (let j = 0; j < wh; j += stepY) {
      const bufX = Math.floor(i * dpr);
      const bufY = Math.floor(j * dpr);
      const index = (bufX + bufY * canvas.width) * 4;

      if (pixelData[index + 3] > 250) {
        particles.push(new Particle(i, j));
      }
    }
  }

  particles.forEach((particle) => {
    particle.wild();
    particle.size(100);
  });

  shuffle(particles);


  startStaggeredRender();
}

// Single render function strictly driven by activeCount
function render() {
  requestAnimationFrame(render);
  ctx.clearRect(0, 0, ww, wh);

  for (let i = 0; i < activeCount; i++) {
    particles[i].render();
  }
}

document.fonts.load("14px 'Fustat'").then(() => {
  initScene();
  render();
});
function onMouseMove(e){
  mouse.x = e.clientX;
  mouse.y = e.clientY;
}
window.addEventListener("mousemove", onMouseMove);
